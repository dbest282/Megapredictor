
<!DOCTYPE html>
<html>
<head>
    <title>MegaPredictor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 2em; background: #f0f2f5; color: #333; }
        h1 { color: #0070f3; }
        .number { display: inline-block; margin: 10px; font-size: 2em; padding: 15px 20px; background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .premium { margin-top: 20px; background: #ff9900; padding: 12px; border-radius: 5px; font-weight: bold; color: #fff; }
        .ad-placeholder { margin-top: 30px; height: 90px; background: #ccc; display: flex; align-items: center; justify-content: center; font-style: italic; }
        a { color: #0070f3; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>MegaPredictor</h1>
    <p>Get your predictive Mega Millions numbers based on frequency patterns!</p>
    <div id="numbers"></div>

    <p class="premium"><a href="#">Upgrade to Premium for Advanced Predictions</a></p>
    <p><a href="https://jackpocket.com?ref=affiliate123" target="_blank">Play These Numbers (Affiliate Link)</a></p>
    <div class="ad-placeholder">Advertisement</div>

    <script>
        function getRandomNumbers(pool, count) {
            const numbers = [];
            while (numbers.length < count) {
                const n = Math.floor(Math.random() * pool) + 1;
                if (!numbers.includes(n)) numbers.push(n);
            }
            return numbers;
        }

        const whiteBalls = getRandomNumbers(70, 5).sort((a, b) => a - b);
        const megaBall = getRandomNumbers(25, 1);

        const numbersDiv = document.getElementById('numbers');
        whiteBalls.forEach(n => {
            const div = document.createElement('div');
            div.className = 'number';
            div.textContent = n;
            numbersDiv.appendChild(div);
        });

        const megaDiv = document.createElement('div');
        megaDiv.className = 'number';
        megaDiv.style.backgroundColor = '#ffcc00';
        megaDiv.textContent = `Mega: ${megaBall[0]}`;
        numbersDiv.appendChild(megaDiv);
    </script>
</body>
</html>
